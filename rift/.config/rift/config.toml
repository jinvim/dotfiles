[settings]
animate = false

default_disable = false

focus_follows_mouse = false
mouse_follows_focus = false

hot_reload = true

[settings.layout]
mode = "master_stack"

[settings.layout.master_stack]
master_ratio = 0.5
master_count = 1
master_side = "left"
new_window_placement = "stack"

[settings.layout.stack]
stack_offset = 0.0

[settings.layout.gaps.outer]
top = 6.0
left = 6.0
bottom = 6.0
right = 6.0

[settings.layout.gaps.inner]
horizontal = 6.0
vertical = 6.0

# enable menu bar workspace indicators
[settings.ui.menu_bar]
enabled = true
show_empty = false
mode = "all"
active_label = "index"
display_style = "label"

# enable horizontal swipes to switch virtual workspaces
[settings.gestures]
enabled = true
consume_dock_swipe = true
skip_empty = false
fingers = 3
haptics_enabled = false

[virtual_workspaces]
enabled = true
default_workspace_count = 5
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
reapply_app_rules_on_title_change = false

# workspace-specific rules
workspace_rules = [
  { workspace = 0, layout = "master_stack" },
  { workspace = 1, layout = "master_stack" },
  { workspace = 2, layout = "master_stack" },
  { workspace = 3, layout = "master_stack" },
  { workspace = 4, layout = "stack" }
]
# All four workspaces inherit settings.layout.mode (traditional).
# workspace_rules = []

app_rules = [
  { app_name = "Positron", workspace = 3 },
  { app_name = "Code", workspace = 3 },
  { app_name = "Zed", workspace = 3 },
  { app_name = "Mail", workspace = 4 },
  { app_name = "Notes", workspace = 4 },
  { app_name = "Calender", workspace = 4 },
  { app_name = "Reminders", workspace = 4 },

  # Apps and windows excluded from yabai management.
  { app_id = "com.apple.SystemSettings", manage = false },
  # { app_id = "com.valvesoftware.steam", manage = false },
  { app_id = "com.apple.FontBook", manage = false },
  { app_id = "com.apple.DigitalColorMeter", manage = false },
  { app_id = "com.raycast.macos", manage = false },
  { title_substring = "MiniPlayer", manage = false },
  { app_name = "Zotero", title_substring = "Citation Dialog", manage = false },
]

workspace_names = [
  "first",
	"second",
  "third",
  "fourth",
  "fifth"
]

[modifier_combinations]
wm1 = "Ctrl"
wm2 = "Ctrl + Shift"
focus1 = "Alt"
focus2 = "Alt + Shift"
focus3 = "Alt + Ctrl"
comb1 = "Alt + Shift"

[keys]
# the following commands *only* work when the master stack layout is active
# - adjust_master_ratio = 0.05 / adjust_master_count = { delta = 1 }
# - promote_to_master / swap_master_stack

"Alt + Z" = "toggle_space_activated"

# workspace / display management
# below hack allows assigning different keybindings for different displays
"wm1 + 1" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 0 && rift-cli execute workspace switch 0"] }
"wm1 + 2" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 0 && rift-cli execute workspace switch 1"] }
"wm1 + 3" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 0 && rift-cli execute workspace switch 2"] }
"wm1 + 4" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 0 && rift-cli execute workspace switch 3"] }
"wm1 + 5" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 0 && rift-cli execute workspace switch 4"] }
"wm1 + 6" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 1 && rift-cli execute workspace switch 0"] }
"wm1 + 7" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 1 && rift-cli execute workspace switch 1"] }
"wm1 + 8" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 1 && rift-cli execute workspace switch 2"] }
"wm1 + 9" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 1 && rift-cli execute workspace switch 3"] }
"wm1 + 0" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display focus --index 1 && rift-cli execute workspace switch 4"] }

"wm2 + 1" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 0 && rift-cli execute workspace move-window 0"] }
"wm2 + 2" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 0 && rift-cli execute workspace move-window 1"] }
"wm2 + 3" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 0 && rift-cli execute workspace move-window 2"] }
"wm2 + 4" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 0 && rift-cli execute workspace move-window 3"] }
"wm2 + 5" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 0 && rift-cli execute workspace move-window 4"] }
"wm2 + 6" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 1 && rift-cli execute workspace move-window 0"] }
"wm2 + 7" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 1 && rift-cli execute workspace move-window 1"] }
"wm2 + 8" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 1 && rift-cli execute workspace move-window 2"] }
"wm2 + 9" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 1 && rift-cli execute workspace move-window 3"] }
"wm2 + 0" = { "exec" = ["/bin/bash", "-c", "rift-cli execute display move-window --index 1 && rift-cli execute workspace move-window 4"] }


# focus / window management
"focus1 + H" = { move_focus = "left" }
"focus1 + J" = { move_focus = "down" }
"focus1 + K" = { move_focus = "up" }
"focus1 + L" = { move_focus = "right" }
"focus1 + Tab" = "switch_to_last_workspace"

"focus2 + H" = { move_node = "left" }
"focus2 + J" = { move_node = "down" }
"focus2 + K" = { move_node = "up" }
"focus2 + L" = { move_node = "right" }

"focus2 + Comma" = { resize_window_shrink = "smart" }
"focus2 + Period" = { resize_window_grow = "smart" }

"focus1 + F" = "toggle_fullscreen_within_gaps"
"focus2 + F" = "toggle_fullscreen"

"focus2 + Space" = { toggle_window_floating = { center = true, size = "smart" } }
"focus2 + A" = { set_workspace_layout = { mode = "floating" } }
"focus2 + D" = { set_workspace_layout = { mode = "master_stack" } }
"focus2 + S" = { set_workspace_layout = { mode = "stack" } }

# "focus3 + Space" = "toggle_window_floating"
# "focus2 + Space" = "toggle_focus_floating" # briefly bring focus to floating window
# "Alt + Slash" = "toggle_orientation"

# app launchers
# "Alt + N" = { "exec" = ["/usr/bin/open", "-a", "Finder"] }
"Alt + B" = { "exec" = ["/usr/bin/open", "-a", "Safari"] }
"Alt + P" = { "exec" = ["/usr/bin/open", "-a", "Positron"] }
"Alt + I" = { "exec" = ["/usr/bin/open", "-a", "ChatGPT"] }
"Alt + T" = { "exec" = ["/usr/bin/open", "-a", "Ghostty.app", "--args", "--quit-after-last-window-closed=true"] }
